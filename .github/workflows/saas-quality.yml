name: SaaS quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, atlas-staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Biome (format, lint and imports)
        run: bun run check
      - name: Build and typecheck
        run: bun run build:test
      - name: Unit tests
        run: bun run test
      - name: Native Node tests
        run: bun run test:node
      - name: Repository audit
        run: node scripts/quality/repository-audit.mjs
      - name: Install browser
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Browser tests
        run: bun run test:e2e
      - name: Cloud contract tests
        run: bun run test:cloud
