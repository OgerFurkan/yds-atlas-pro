name: SaaS quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-axe-once:
    # One-time lockfile-safe free accessibility dependency on PR #26 only; deleted next Builder commit.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 26 && github.event.pull_request.head.repo.full_name == 'OgerFurkan/yds-atlas-pro' && github.event.pull_request.head.ref == 'feature/platform-foundation-f1-f3-20261122-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-foundation-f1-f3-20261122-builder
          persist-credentials: true
          fetch-depth: 2
      - name: Deny stale or unintended checkout
        run: test "$(git rev-parse HEAD^)" = 73ca7bd89ca5cd135bae5dd4596dcce36c549159
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Install pinned open-source axe Playwright adapter in frontend workspace
        run: |
          bun install --frozen-lockfile
          cd frontend
          bun add --dev --exact @axe-core/playwright@4.14.0
      - name: Verify only frontend manifest and Bun lock changed
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process";const list=execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).trim().split("\n").sort();if(JSON.stringify(list)!==JSON.stringify(["bun.lock","frontend/package.json"])) {console.error("BLOCKED: unexpected dependency change",list);process.exit(1)}'
          git diff --check
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun run build
      - name: Commit dependency-only update to same PR branch
        run: |
          test "$(git rev-parse HEAD^)" = 73ca7bd89ca5cd135bae5dd4596dcce36c549159
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/package.json bun.lock
          git commit -m 'chore(qa): pin free axe-core Playwright adapter in Bun lock'
          git push origin HEAD:refs/heads/feature/platform-foundation-f1-f3-20261122-builder
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Local platform source contract (not provider PASS)
        run: node scripts/quality/foundation-contract.mjs
      - name: Staging provenance negative tests (synthetic, offline)
        run: node --test scripts/release/staging-manifest.test.mjs
      - name: Lint
        run: bun run lint
      - name: Build and typecheck
        run: bun run build
      - name: Unit and API tests
        run: bun test backend/tests frontend/tests/unit
      - name: Standalone Node contract tests
        run: node --test frontend/tests/atlas-tiered-examples.node.test.mjs frontend/tests/feedback-auth-storage.node.test.mjs
      - name: Repository audit
        run: node scripts/quality/repository-audit.mjs
      - name: Install Chromium
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Browser regressions
        run: bun run --cwd=frontend test:e2e
      - name: Isolated fake-cloud contracts
        run: bun run --cwd=frontend test:cloud
      - name: Full repository format check (explicit FAIL on legacy debt)
        run: bun run format:check

  optional-quality-matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Build local preview
        run: bun run build
      - name: Install Chromium Firefox WebKit
        run: cd frontend && bunx playwright install --with-deps chromium firefox webkit
      - name: Multi-browser local keyboard and responsive QA
        run: cd frontend && bunx playwright test --config playwright.qa.config.ts
