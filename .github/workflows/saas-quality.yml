name: SaaS quality gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and typecheck
        run: bun run build
      - name: Unit tests
        run: bun test backend/tests frontend/tests/unit
      - name: Repository audit
        run: node scripts/quality/repository-audit.mjs
      - name: Compare real Wiktionary edition coverage (temporary branch-only)
        if: github.head_ref == 'fix/fb-live01-turkish-source-20261120'
        run: |
          python3 - <<'PY'
          import json, urllib.request
          words=['climate','house','water','approach','evidence','research']
          for edition in ['tr','en']:
              for word in words:
                  url=f'https://api.wiktapi.dev/v1/{edition}/word/{word}?lang=en'
                  req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'YDSAtlasPro-QA'})
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      body=json.loads(resp.read(500000))
                  if word in ('climate','house'): print('payload:',edition,word,str(body)[:700])
                  english=[e for e in body.get('entries',[]) if e.get('lang_code')=='en']
                  glosses=sum(len(s.get('glosses',[])) for e in english for s in e.get('senses',[]))
                  turkish_trans=sum(1 for e in english for t in e.get('translations',[]) if t.get('code')=='tr' or t.get('lang_code')=='tr')
                  print(f'{edition}:{word}: entries={len(english)}, glosses={glosses}, turkish_translations={turkish_trans}')
          PY
      - name: Install browser
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Browser tests
        run: bun run --cwd=frontend test:e2e
