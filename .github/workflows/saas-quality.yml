name: SaaS quality gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and typecheck
        run: bun run build
      - name: Unit tests
        run: bun test backend/tests frontend/tests/unit
      - name: Repository audit
        run: node scripts/quality/repository-audit.mjs
      - name: External Turkish Wiktionary source smoke (temporary branch-only)
        if: github.head_ref == 'fix/fb-live01-turkish-source-20261120'
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://api.wiktapi.dev/v1/tr/word/climate?lang=en'
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'YDSAtlasPro/1.0-QA'})
          with urllib.request.urlopen(req,timeout=12) as resp:
              body=json.loads(resp.read(500000))
          filtered=[x for x in body.get('entries',[]) if x.get('word')=='climate' and x.get('lang_code')=='en']
          meanings=[g for x in filtered for y in x.get('senses',[]) for g in y.get('glosses',[]) if isinstance(g,str) and g.strip()]
          print('tr edition:',body.get('edition'),'english entries:',len(filtered),'Turkish glosses:',len(meanings))
          assert body.get('edition')=='tr' and body.get('word')=='climate' and meanings
          PY
      - name: Install browser
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Browser tests
        run: bun run --cwd=frontend test:e2e
