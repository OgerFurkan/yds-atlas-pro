name: FB-LIVE-01 Turkish source smoke (temporary branch-only)
on:
  push:
    branches:
      - fix/fb-live01-turkish-source-20261120
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live Turkish Wiktionary API without keys or personal data
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          url="https://api.wiktapi.dev/v1/tr/word/climate?lang=en"
          req=urllib.request.Request(url,headers={
              "Accept":"application/json","User-Agent":"YDSAtlasPro/1.0 QA"})
          with urllib.request.urlopen(req,timeout=12) as response:
              body=response.read(1000000)
          data=json.loads(body)
          entries=[e for e in data.get("entries",[]) if
              e.get("word")=="climate" and e.get("lang_code")=="en"]
          glosses=[g for e in entries for s in e.get("senses",[])
                  for g in s.get("glosses",[]) if isinstance(g,str) and g.strip()]
          print("edition:",data.get("edition"),"english_entries:",len(entries),
                "glosses:",len(glosses))
          assert data.get("edition")=="tr"
          assert data.get("word")=="climate"
          assert glosses, "No Turkish Wiktionary gloss found for climate"
          PY
