name: SaaS quality gates
on:
  push:
    branches: [main, atlas-staging]
  pull_request:
    branches: [main, atlas-staging]

permissions:
  contents: read

concurrency:
  group: saas-quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: bun run playwright install --with-deps chromium
      - name: Verify local contracts
        run: bun run quality:local --synthetic-schema
        env:
          ATLAS_QUALITY_REPORT: ${{ runner.temp }}/atlas-quality.json
      - name: Repository-wide Biome
        if: ${{ !cancelled() }}
        run: bun run check
      - name: Upload safe quality summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atlas-quality.json
          if-no-files-found: error
          retention-days: 14
