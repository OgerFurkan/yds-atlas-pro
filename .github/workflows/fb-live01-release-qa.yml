name: FB-LIVE-01 isolated release acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fb-live01-qa-pr
  cancel-in-progress: false

jobs:
  accept:
    if: github.head_ref == 'qa/fb-live01-release-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_DB: fb_live01_ephemeral
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fb_live01_qa_synthetic_only
        ports:
          - "127.0.0.1:55437:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d fb_live01_ephemeral"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout only the QA branch (never main)
        uses: actions/checkout@v4
        with:
          ref: qa/fb-live01-release-20261120
          fetch-depth: 0
          persist-credentials: false

      - name: Verify actual app release tree and SQL SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5b2f7446feca233df5223368ad0ed471d348c8bc HEAD
          test "$(git show -s --format=%T 5b2f7446feca233df5223368ad0ed471d348c8bc)" = "1a5ab7fb585bf855c158b0567ee63d91c0f5f673"
          test "$(git show -s --format=%P 5b2f7446feca233df5223368ad0ed471d348c8bc)" = "82c18636e41888ec607863b395e023b9762d1348"
          echo "f20be2a2d1b7ee7fa2c20928d2f2756925aea184af3605d4724626b3667201ba  supabase/migrations/20261119180000_feedback_lexicon_minimal_pg17.sql" | sha256sum --check
          test -z "$(git status --porcelain)"
          echo "APP_TREE_EXACT_PASS and SQL_SHA_EXACT_PASS"

      - name: Ephemeral PG17 migration, role/RLS, lease, publish, rollback
        id: pg17
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55437"
          PGDATABASE: fb_live01_ephemeral
          PGUSER: postgres
          PGPASSWORD: fb_live01_qa_synthetic_only
        run: |
          set -euo pipefail
          pg_isready
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261119180000_feedback_lexicon_minimal_pg17.sql
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('atlas_lexicon_entries','atlas_lexicon_jobs','atlas_lexicon_entry_revisions') AND c.relrowsecurity")" = "3"
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT has_function_privilege('anon','public.atlas_lexicon_claim_v1(text,text,text,uuid)','EXECUTE')")" = "f"
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT has_function_privilege('authenticated','public.atlas_lexicon_publish_v1(text,text,text,uuid,text,text,text,jsonb,jsonb,text)','EXECUTE')")" = "f"
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT has_function_privilege('service_role','public.atlas_lexicon_claim_v1(text,text,text,uuid)','EXECUTE')")" = "t"
          for role in anon authenticated; do
            if psql -X -v ON_ERROR_STOP=1 -c "SET ROLE $role; SELECT * FROM public.atlas_lexicon_entries LIMIT 1"; then
              echo "STOP: $role read unexpectedly succeeded"; exit 1
            fi
            if psql -X -v ON_ERROR_STOP=1 -c "SET ROLE $role; SELECT public.atlas_lexicon_claim_v1('climate','Tooltip',repeat('a',64),'11111111-1111-4111-8111-111111111111'::uuid)"; then
              echo "STOP: $role function unexpectedly executable"; exit 1
            fi
          done
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE service_role;
          DO $accept$
          DECLARE returned integer;
          BEGIN
            IF public.atlas_lexicon_claim_v1('climate','Tooltip',repeat('a',64),'11111111-1111-4111-8111-111111111111'::uuid) IS DISTINCT FROM true
              THEN RAISE EXCEPTION 'Lease acquisition failed'; END IF;
            IF public.atlas_lexicon_claim_v1('climate','Tooltip',repeat('a',64),'22222222-2222-4222-8222-222222222222'::uuid) IS DISTINCT FROM false
              THEN RAISE EXCEPTION 'Concurrent lease incorrectly acquired'; END IF;
            SELECT count(*) INTO returned FROM public.atlas_lexicon_publish_v1(
              'climate','Tooltip',repeat('a',64),'11111111-1111-4111-8111-111111111111'::uuid,
              'climate','Tooltip',repeat('a',64),
              '{"word":"climate","partOfSpeech":"Tooltip","meanings":["iklim"],"examples":[]}'::jsonb,
              '{"kind":"atlas_tooltip_gloss_v1","license":"CC BY-SA 4.0"}'::jsonb,
              repeat('b',64));
            IF returned <> 1 THEN RAISE EXCEPTION 'First publication failed'; END IF;
            SELECT count(*) INTO returned FROM public.atlas_lexicon_publish_v1(
              'climate','Tooltip',repeat('a',64),'11111111-1111-4111-8111-111111111111'::uuid,
              'climate','Tooltip',repeat('a',64),
              '{"word":"climate","partOfSpeech":"Tooltip","meanings":["iklim"],"examples":[]}'::jsonb,
              '{"kind":"atlas_tooltip_gloss_v1","license":"CC BY-SA 4.0"}'::jsonb,
              repeat('b',64));
            IF returned <> 0 THEN RAISE EXCEPTION 'Consumed lease reused'; END IF;
          END;
          $accept$;
          RESET ROLE;
          DO $audit$
          BEGIN
            IF (SELECT count(*) FROM public.atlas_lexicon_entries WHERE word_key='climate') <> 1
              THEN RAISE EXCEPTION 'Entry count not one'; END IF;
            IF (SELECT count(*) FROM public.atlas_lexicon_entry_revisions) <> 1
              THEN RAISE EXCEPTION 'Audit revision count not one'; END IF;
          END;
          $audit$;
          ROLLBACK;
          SQL
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.atlas_lexicon_entries")" = "0"
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.atlas_lexicon_entry_revisions")" = "0"
          echo "PG17_MIGRATION_ACL_LEASE_REVISION_ROLLBACK_PASS (ephemeral only)"

      - name: Setup pinned Bun 1.3.5
        id: bun_setup
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Frozen dependency install (no lifecycle scripts)
        id: frozen
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Backend typecheck
        id: backend_typecheck
        continue-on-error: true
        run: bun run typecheck:api

      - name: Full frontend build and backend typecheck
        id: full_build
        continue-on-error: true
        run: bun run build

      - name: Frontend and backend lint
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Unit and API regressions
        id: unit
        continue-on-error: true
        run: bun test backend/tests frontend/tests/unit

      - name: Install isolated Chromium for Playwright
        id: chromium
        continue-on-error: true
        run: bunx playwright install --with-deps chromium

      - name: Playwright Inspector desktop (tooltip, 2/1/2, game block)
        id: inspector
        continue-on-error: true
        working-directory: frontend
        run: bunx playwright test --config playwright.inspector.config.ts --project desktop

      - name: Playwright general mock desktop
        id: general
        continue-on-error: true
        working-directory: frontend
        run: bunx playwright test --config playwright.cloud.config.ts --project desktop

      - name: Enforce real QA gate outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          echo "source: ${{ steps.source.outcome }}"
          if [ "${{ steps.source.outcome }}" != "success" ]; then failed=1; fi
          echo "pg17: ${{ steps.pg17.outcome }}"
          if [ "${{ steps.pg17.outcome }}" != "success" ]; then failed=1; fi
          echo "bun_setup: ${{ steps.bun_setup.outcome }}"
          if [ "${{ steps.bun_setup.outcome }}" != "success" ]; then failed=1; fi
          echo "frozen: ${{ steps.frozen.outcome }}"
          if [ "${{ steps.frozen.outcome }}" != "success" ]; then failed=1; fi
          echo "backend_typecheck: ${{ steps.backend_typecheck.outcome }}"
          if [ "${{ steps.backend_typecheck.outcome }}" != "success" ]; then failed=1; fi
          echo "full_build: ${{ steps.full_build.outcome }}"
          if [ "${{ steps.full_build.outcome }}" != "success" ]; then failed=1; fi
          echo "lint: ${{ steps.lint.outcome }}"
          if [ "${{ steps.lint.outcome }}" != "success" ]; then failed=1; fi
          echo "unit: ${{ steps.unit.outcome }}"
          if [ "${{ steps.unit.outcome }}" != "success" ]; then failed=1; fi
          echo "chromium: ${{ steps.chromium.outcome }}"
          if [ "${{ steps.chromium.outcome }}" != "success" ]; then failed=1; fi
          echo "inspector: ${{ steps.inspector.outcome }}"
          if [ "${{ steps.inspector.outcome }}" != "success" ]; then failed=1; fi
          echo "general: ${{ steps.general.outcome }}"
          if [ "${{ steps.general.outcome }}" != "success" ]; then failed=1; fi
          if [ "$failed" -ne 0 ]; then
            echo "QA_GATE_FAIL: real failed/skipped steps must not be reported PASS"
            exit 1
          fi
          echo "FB_LIVE01_ALL_QA_GATES_PASS"
