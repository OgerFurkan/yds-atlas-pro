name: SaaS quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Biome format gate (full existing scope; fail fast)
        run: bun run format:check
      - name: Tracked source secret scan (redacted output)
        run: node scripts/quality/secret-scan.mjs
      - name: Local target and secret scanner failure-injection tests
        run: node --test scripts/local/target-guard.test.mjs scripts/quality/secret-scan.test.mjs
      - name: Dependency vulnerabilities (high and critical fail)
        run: bun audit --audit-level=high
      - name: Local platform source contract (not provider PASS)
        run: node scripts/quality/foundation-contract.mjs
      - name: Staging provenance negative tests (synthetic, offline)
        run: node --test scripts/release/staging-manifest.test.mjs
      - name: Lint
        run: bun run lint
      - name: Build and typecheck
        run: bun run build
      - name: Unit and API tests
        run: bun test backend/tests frontend/tests/unit
      - name: Standalone Node contract tests
        run: node --test frontend/tests/atlas-tiered-examples.node.test.mjs frontend/tests/feedback-auth-storage.node.test.mjs
      - name: Repository audit
        run: node scripts/quality/repository-audit.mjs
      - name: Local Bun HTTP health, CORS negative, and p50/p95 sample
        run: |
          HOST=127.0.0.1 PORT=3000 bun run backend/src/index.ts > /tmp/atlas-f1-local-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          node scripts/quality/local-health-benchmark.mjs
      - name: Install Chromium
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Browser regressions
        run: bun run --cwd=frontend test:e2e
      - name: Isolated fake-cloud contracts
        run: bun run --cwd=frontend test:cloud

  optional-quality-matrix:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 26)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Build local preview
        run: bun run build
      - name: Install Chromium Firefox WebKit
        run: cd frontend && bunx playwright install --with-deps chromium firefox webkit
      - name: Multi-browser local keyboard and responsive QA
        run: cd frontend && bunx playwright test --config playwright.qa.config.ts

  local-provider-integration:
    # Real Docker / LOCAL Supabase on a disposable standard Linux GitHub runner.
    # Windows host acceptance and STAGING provider tests remain separate gates.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 26)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Frozen install and Docker daemon verification
        run: |
          bun install --frozen-lockfile
          docker info --format '{{.ServerVersion}}'
          node scripts/local/preflight.mjs
      - name: Start isolated LOCAL PG17 and Supabase Auth
        run: |
          bunx supabase --help > /dev/null
          bunx supabase start
      - name: Two genuine synthetic GoTrue JWT accounts and RLS negatives
        run: |
          export LOCAL_SUPABASE_URL=http://127.0.0.1:54321
          LOCAL_SUPABASE_ANON_KEY="$(bunx supabase status -o json | node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk).on("end",()=>{const status=JSON.parse(data);process.stdout.write(status.ANON_KEY||status.anon_key||"")})')"
          test -n "$LOCAL_SUPABASE_ANON_KEY"
          export LOCAL_SUPABASE_ANON_KEY
          node scripts/local/supabase-tenant-smoke.mjs
      - name: Local Render-style Docker build and non-root HTTP health
        run: |
          docker build -f backend/Dockerfile -t atlas-f1-ci-api .
          test "$(docker image inspect atlas-f1-ci-api --format '{{.Config.User}}')" = bun
          docker run -d --name atlas-f1-ci-api --network none -e HOST=127.0.0.1 -e PORT=3000 atlas-f1-ci-api
          docker exec atlas-f1-ci-api bun -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(r.status!==200)process.exit(1);console.log('LOCAL_DOCKER_LIVENESS_PASS')})"
      - name: Cleanup LOCAL disposable containers
        if: always()
        run: |
          docker rm -f atlas-f1-ci-api 2>/dev/null || true
          bunx supabase stop 2>/dev/null || true
