name: SaaS quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-once:
    # One-time PM-requested formatter repair; removed in follow-up Builder commit.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 26 && github.event.pull_request.head.repo.full_name == 'OgerFurkan/yds-atlas-pro' && github.event.pull_request.head.ref == 'feature/platform-foundation-f1-f3-20261122-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-foundation-f1-f3-20261122-builder
          persist-credentials: true
          fetch-depth: 2
      - name: Deny stale or unintended checkout
        run: test "$(git rev-parse HEAD^)" = cdac294320755d1c08a894eee0e9804b8b4aac86
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run exact root Biome formatter scope (no lint fix, no organize imports)
        run: bun run format
      - name: Verify full formatting and diff integrity
        run: |
          bun run format:check
          git diff --check
          git diff --stat
          git diff --name-only
      - name: Deny unexpected secret, workflow, infrastructure or migration diff
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; const files=execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).trim().split("\n").filter(Boolean); const ok=f=>/^frontend\/(src\/|tests\/|config\/|playwright\.|vite\.config|components\.json)/.test(f)||/^backend\/(src\/|tests\/|tsconfig\.json|package\.json)/.test(f)||/^packages\/shared\/src\//.test(f)||["frontend/package.json","package.json","vercel.json"].includes(f); if(!files.length||files.some(f=>!ok(f))){console.error("BLOCKED: unexpected formatting changes",files);process.exit(1)} console.log("Formatting-only paths:",files.length);'
      - name: Test formatter change before committing
        run: |
          bun run lint
          bun run build
          bun test backend/tests frontend/tests/unit
          node scripts/quality/foundation-contract.mjs
          node --test scripts/release/staging-manifest.test.mjs
      - name: Commit format-only diff on authorized feature branch
        run: |
          test "$(git rev-parse HEAD^)" = cdac294320755d1c08a894eee0e9804b8b4aac86
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/src frontend/tests frontend/config frontend/playwright.config.ts frontend/playwright.dev.config.ts frontend/playwright.cloud.config.ts frontend/vite.config.ts frontend/components.json frontend/package.json backend/src backend/tests backend/tsconfig.json backend/package.json packages/shared/src package.json vercel.json
          git commit -m 'style(foundation): resolve 103 pre-existing Biome diagnostics without code refactor'
          git push origin HEAD:refs/heads/feature/platform-foundation-f1-f3-20261122-builder
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Local platform source contract (not provider PASS)
        run: node scripts/quality/foundation-contract.mjs
      - name: Staging provenance negative tests (synthetic, offline)
        run: node --test scripts/release/staging-manifest.test.mjs
      - name: Lint
        run: bun run lint
      - name: Build and typecheck
        run: bun run build
      - name: Unit and API tests
        run: bun test backend/tests frontend/tests/unit
      - name: Standalone Node contract tests
        run: node --test frontend/tests/atlas-tiered-examples.node.test.mjs frontend/tests/feedback-auth-storage.node.test.mjs
      - name: Repository audit
        run: node scripts/quality/repository-audit.mjs
      - name: Install Chromium
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Browser regressions
        run: bun run --cwd=frontend test:e2e
      - name: Isolated fake-cloud contracts
        run: bun run --cwd=frontend test:cloud
      - name: Full repository format check (explicit FAIL on legacy debt)
        run: bun run format:check

  optional-quality-matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Build local preview
        run: bun run build
      - name: Install Chromium Firefox WebKit
        run: cd frontend && bunx playwright install --with-deps chromium firefox webkit
      - name: Multi-browser local keyboard and responsive QA
        run: cd frontend && bunx playwright test --config playwright.qa.config.ts
