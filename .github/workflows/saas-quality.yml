name: SaaS quality gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and typecheck
        run: bun run build
      - name: Unit tests
        run: bun test backend/tests frontend/tests/unit
      - name: Repository audit
        run: node scripts/quality/repository-audit.mjs
      - name: Install browser
        run: bun run --cwd=frontend playwright install --with-deps chromium
      - name: Browser tests
        run: bun run --cwd=frontend test:e2e
